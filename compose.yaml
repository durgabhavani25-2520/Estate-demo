services:
  estatebridge:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ADMIN_ACCESS_TOKEN: ${ADMIN_ACCESS_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    volumes:
      - estatebridge-data:/app/instance

volumes:
  estatebridge-data:
