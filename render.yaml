services:
  - type: web
    name: estatebridge-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: estate
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/config
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_ACCESS_TOKEN
        generateValue: true
    disk:
      name: estatebridge-data
      mountPath: /app/instance
      sizeGB: 1
